[project]
name = "vendor-api-documentation-assistant"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.165.0",
    "ollama>=0.6.3",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.2",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.4",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
